; Alert clock firmware for the HG V3.2.2 ESP8266 IPS clock.
; Hardware facts come from the re-nixie-clock reconstruction (see README.md).

[platformio]
default_envs = clock

; Settings shared by the clock and the PC build.
[env]
lib_deps =
  lovyan03/LovyanGFX@1.3.0
  etlcpp/Embedded Template Library@20.49.0
build_flags =
  ; ETL containers trap overflow and bad indexes instead of corrupting memory.
  -D ETL_CHECK_PUSH_POP
  -D ETL_CHECK_INDEX_OPERATOR
  -D ETL_USE_ASSERT_FUNCTION

; The clock.
[env:clock]
platform = espressif8266@4.2.1            ; Arduino-ESP8266 core 3.1.2, GCC 10.3
board = esp12e                            ; 4 MB flash ESP8266
framework = arduino
board_build.f_cpu = 160000000L
board_build.flash_mode = dio              ; supplier image header: DIO, 40 MHz
board_build.ldscript = eagle.flash.4m2m.ld ; ~1 MB app + equal OTA space, 2 MB LittleFS
board_build.filesystem = littlefs
build_src_filter = +<device/>
build_src_flags = -Wall -Wextra -Werror -Wnull-dereference
lib_deps =
  ${env.lib_deps}
  adafruit/Adafruit NeoPixel@1.15.5
build_flags =
  ${env.build_flags}
  -fstack-protector
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder
upload_speed = 460800

; Uploads over Wi-Fi to /update: pio run -e clock-ota -t upload --upload-port <clock IP>
; with CLOCK_ADMIN_PASSWORD set in the environment.
[env:clock-ota]
extends = env:clock
upload_protocol = custom
upload_command = curl --fail --silent --show-error -u "admin:$$CLOCK_ADMIN_PASSWORD" -F "firmware=@$SOURCE" http://$UPLOAD_PORT/update

; The clock with heap-corruption checks and core debug output on Serial.
[env:clock-debug]
extends = env:clock
build_type = debug
build_flags =
  ${env:clock.build_flags}
  -D UMM_INTEGRITY_CHECK
  -D UMM_POISON_CHECK
  -D DEBUG_ESP_PORT=Serial

; The PC build: unit tests (pio test -e native) and the scenario runner
; (tools/run_scenarios.py). Needs SDL2 headers for LovyanGFX's PC backend.
[env:native]
platform = native@1.2.1
build_src_filter = +<native/>
build_src_flags = -Wall -Wextra -Werror -Wnull-dereference
build_type = debug
lib_deps =
  ${env.lib_deps}
  ; Only the scenario program reads JSON (the scenario files).
  bblanchon/ArduinoJson@7.4.3
build_flags =
  ${env.build_flags}
  -D ETL_VERBOSE_ERRORS
  -I test/support/esp8266
  -std=gnu++17
  -lSDL2
; AddressSanitizer + UBSan on this project's code; see the script.
extra_scripts = pre:scripts/sanitizers.py
test_framework = unity
